name: Publish shared design pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      - name: Stage public simulator and prototype assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/design-pages"
          for asset in index.html style.css app.mjs catalog.mjs model.mjs analysis.mjs; do
            cp "$asset" "$RUNNER_TEMP/design-pages/"
          done
          mkdir -p "$RUNNER_TEMP/design-pages/assets"
          cp assets/fantasy-pixel-atlas.png "$RUNNER_TEMP/design-pages/assets/"
          if [ -d prototypes ]; then
            cp -R prototypes "$RUNNER_TEMP/design-pages/prototypes"
          fi
          touch "$RUNNER_TEMP/design-pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/design-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
